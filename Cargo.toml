[workspace]
members = [
    "programs/*",
]
resolver = "2"

[workspace.dependencies]
# Anchor 0.31.0 - Matches user's successful sol-bets-v3 project
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

# CRITICAL: Do NOT add solana-program here!
# It causes version conflicts with Anchor's internal Solana crates
# Use anchor_lang::solana_program in your code instead

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
